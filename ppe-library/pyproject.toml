[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppe-navigation"
version = "0.1.0a1"
description = "Preference Pareto Exploration for user-defined PyTorch multitask problems"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Augustina C. Amakor"}]
dependencies = ["torch>=2.2,<3", "numpy>=1.26,<2", "scipy>=1.11,<2", "tqdm>=4.66,<5"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7,<4", "tornado>=6.3,<7"]
web = ["matplotlib>=3.7,<4", "tornado>=6.3,<7"]
dev = ["build>=1", "twine>=5"]

[project.scripts]
ppe = "ppe.cli:main"

[project.urls]
Repository = "https://github.com/aamakor/PPE"
Issues = "https://github.com/aamakor/PPE/issues"

[tool.setuptools.packages.find]
where = ["src"]
