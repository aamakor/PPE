name: Publish PPE documentation
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ppe-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize website references and downloads
        run: python3 ppe-library/tools/sync_site.py
      - name: Check website files
        run: python3 -m unittest discover -s ppe-library/tests -p test_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ppe-library/docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
